[workspace]
members = [
    "crates/volume-loader",
    "crates/renderer",
    "crates/encoder",
    "crates/transport",
    "crates/server",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + WebSocket
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# GPU
wgpu = { version = "24", features = ["vulkan-portability"] }
bytemuck = { version = "1", features = ["derive"] }

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Volume loading
zarrs = { version = "0.20", features = ["filesystem"] }
flate2 = "1"
ndarray = "0.16"

# WebRTC
str0m = "0.6"

# Encoding
openh264 = "0.6"
ffmpeg-next = { version = "8.1", features = ["software-scaling"] }

# Config + CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# TLS
rcgen = "0.13"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Utilities
rand = "0.9"
pollster = "0.4"
