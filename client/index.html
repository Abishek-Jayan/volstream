<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR Volumetric Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 { font-size: 1.5rem; margin-bottom: 2rem; }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 2rem;
      width: 320px;
    }

    p { margin-top: 0; }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.5rem;
      text-align: center;
      letter-spacing: 0.5rem;
      background: #0a0a0a;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #555; cursor: default; }

    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      min-height: 1.2em;
    }

    #xr-section { display: none; margin-top: 0; }

    #fps-counter {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(0, 0, 0, 0.6);
      color: #00ff00;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      pointer-events: none;
      z-index: 100;
    }

    #channel-section { margin-top: 1.25rem; }
    #channel-section p { font-size: 0.85rem; color: #aaa; margin-bottom: 0.5rem; }
    .ch-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .ch-row label { font-size: 0.8rem; color: #ccc; width: 4rem; flex-shrink: 0; }
    .ch-row input[type="color"] {
      width: 2.2rem; height: 2rem; padding: 0; border: none;
      border-radius: 3px; cursor: pointer; background: none;
    }
    .ch-row input[type="range"] {
      flex: 1; accent-color: #2563eb;
    }
    .ch-opacity-val { font-size: 0.75rem; color: #aaa; width: 2.5rem; text-align: right; }
  </style>
</head>
<body>
  <h1>WebXR Volumetric Viewer</h1>

  <div class="card">
    <!-- Pairing UI -->
    <div id="pair-section">
      <p>Enter the pairing code shown on the server console:</p>
      <input id="code-input" type="text" inputmode="numeric"
             maxlength="6" placeholder="000000" autocomplete="off">
      <button id="connect-btn" onclick="connect()">Connect</button>
      <div id="status" class="status"></div>
    </div>

    <!-- XR UI — shown after successful pairing -->
    <div id="xr-section">
      <p>Connected! Volume is rendering on the server.</p>
      <button id="xr-btn" onclick="enterXR()">Enter VR</button>
      <button id="ar-btn" onclick="enterAR()" style="display:none; background:#16a34a;">Enter AR (Passthrough)</button>
      <div id="status2" class="status"></div>
    </div>

    <!-- Channel color/opacity controls — shown when channel_count > 1 -->
    <div id="channel-section" style="display:none;">
      <p>Channel Colors &amp; Opacity</p>
      <div id="channel-controls"></div>
    </div>
  </div>

  <div id="fps-counter">-- fps</div>
  <script src="app.js"></script>
</body>
</html>
